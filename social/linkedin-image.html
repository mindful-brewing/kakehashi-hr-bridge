<!doctype html><html><head><meta charset="utf8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap');

  :root {
    --paper: #F5F4EF;
    --paper-raised: #FCFBF8;
    --ink: #1E2933;
    --ink-soft: #52626D;
    --ink-faint: #7C8991;
    --indigo: #2F4C68;
    --marigold: #C97C2E;
    --marigold-deep: #A5611D;
    --line: rgba(30, 41, 51, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 1200px;
    background: var(--paper);
    font-family: "Zen Kaku Gothic New", sans-serif;
  }
  .frame {
    width: 1200px;
    height: 1200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid var(--line);
  }
  .eyebrow {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: var(--marigold-deep);
    margin-bottom: 56px;
  }
  .bridge-art { width: 620px; height: auto; margin-bottom: 56px; }
  .brandmark {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 34px;
  }
  .brandmark .mark {
    font-family: "Zen Old Mincho", serif;
    font-weight: 700;
    font-size: 76px;
    color: var(--ink);
    letter-spacing: 0.03em;
  }
  .brandmark .sub {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    color: var(--ink-soft);
  }
  .tagline {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
    font-size: 30px;
    color: var(--ink-soft);
    margin-bottom: 64px;
  }
  .footer-url {
    position: absolute;
    bottom: 56px;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">JAPAN &times; INDIA</p>

  <svg class="bridge-art" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
    <line x1="40" y1="210" x2="440" y2="210" stroke="var(--ink)" stroke-width="2.4" opacity="0.55"/>
    <line x1="150" y1="210" x2="150" y2="70" stroke="var(--ink)" stroke-width="2.4" opacity="0.55"/>
    <line x1="330" y1="210" x2="330" y2="70" stroke="var(--ink)" stroke-width="2.4" opacity="0.55"/>
    <line x1="150" y1="70" x2="330" y2="70" stroke="var(--ink)" stroke-width="2.4" opacity="0.55"/>
    <g stroke="var(--indigo)" stroke-width="1.6" opacity="0.85">
      <line x1="150" y1="70" x2="60" y2="210"/>
      <line x1="150" y1="70" x2="95" y2="210"/>
      <line x1="150" y1="70" x2="130" y2="210"/>
      <line x1="150" y1="70" x2="150" y2="210"/>
      <line x1="150" y1="70" x2="185" y2="210"/>
      <line x1="150" y1="70" x2="220" y2="210"/>
    </g>
    <g stroke="var(--marigold)" stroke-width="1.6" opacity="0.9">
      <line x1="330" y1="70" x2="260" y2="210"/>
      <line x1="330" y1="70" x2="295" y2="210"/>
      <line x1="330" y1="70" x2="330" y2="210"/>
      <line x1="330" y1="70" x2="365" y2="210"/>
      <line x1="330" y1="70" x2="400" y2="210"/>
      <line x1="330" y1="70" x2="420" y2="210"/>
    </g>
    <circle cx="40" cy="210" r="8" fill="var(--indigo)"/>
    <circle cx="440" cy="210" r="8" fill="var(--marigold)"/>
    <text x="40" y="242" font-family="Fraunces, serif" font-style="italic" font-size="17" fill="var(--ink-soft)" text-anchor="middle">JP</text>
    <text x="440" y="242" font-family="Fraunces, serif" font-style="italic" font-size="17" fill="var(--ink-soft)" text-anchor="middle">IN</text>
  </svg>

  <div class="brandmark">
    <span class="mark">架け橋</span>
    <span class="sub">Kakehashi — HR Bridge</span>
  </div>
  <p class="tagline">Bridging how Japan and India work.</p>
  <p class="footer-url">mindful-brewing.github.io/kakehashi-hr-bridge/en</p>
</div>
</body></html>
